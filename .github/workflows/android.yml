name: Android CI
on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']
  pull_request:
    paths-ignore: ['README.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run JVM unit tests
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Room, Compose, encryption and actual device credential tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash scripts/run_instrumented.sh
      - name: Record actual XML test counts
        if: always()
        run: python3 scripts/summarize_tests.py --require-complete
      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
            evidence/test-summary.json
            evidence/test-summary.md
            evidence/device-*
      - name: Upload three real emulator screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-api34
          path: evidence/screenshots/*.png
          if-no-files-found: warn
